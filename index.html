    if (box) { box.style.display = 'block'; box.textContent += msg + '\n\n'; }
  }
  window.addEventListener('error', function (e) {
    showError('Error: ' + (e.message || e) + (e.filename ? (' @ ' + e.filename + ':' + e.lineno) : ''));

    showError('Promesa rechazada: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
</script>

// ---- Gráfico de saldo, hecho a mano en SVG (sin librerías externas) ----
function BalanceChart({ data }) {
  const width = 320;
  const height = 160;
  const padL = 44;
  const padB = 20;
  const padT = 10;
  const padR = 10;
  const values = data.map((d) => d.saldo);
  const max = Math.max(1, ...values);
  const min = 0;
  const innerW = width - padL - padR;
  const innerH = height - padT - padB;

  const x = (i) => padL + (data.length === 1 ? innerW / 2 : (i / (data.length - 1)) * innerW);
  const y = (v) => padT + innerH - ((v - min) / (max - min || 1)) * innerH;

  let path = '';
  data.forEach((d, i) => {
    const px = x(i);
    const py = y(d.saldo);
    if (i === 0) {
      path += `M ${px} ${py}`;
    } else {
      const prevY = y(data[i - 1].saldo);
      path += ` L ${px} ${prevY} L ${px} ${py}`;
    }
  });

  const yTicks = [0, max / 2, max];

  return React.createElement(
    'svg',
    { viewBox: `0 0 ${width} ${height}`, style: { width: '100%', height: 180 } },
    React.createElement(
      'defs',
      null,
      React.createElement(
        'linearGradient',
        { id: 'lineColor', x1: '0', y1: '0', x2: '1', y2: '0' },
        React.createElement('stop', { offset: '0%', stopColor: '#7C3AED' }),
        React.createElement('stop', { offset: '100%', stopColor: '#DB2777' })
      )
    ),
    yTicks.map((t, i) =>
      React.createElement('line', {
        key: i,
        x1: padL,
        x2: width - padR,
        y1: y(t),
        y2: y(t),
        stroke: '#F1EBFF',
        strokeWidth: 1,
      })
    ),
    yTicks.map((t, i) =>
      React.createElement(
        'text',
        { key: 'lbl' + i, x: padL - 6, y: y(t) + 3, fontSize: 9, fill: '#9187AC', textAnchor: 'end' },
        fmt(t)
      )
    ),
    React.createElement('path', { d: path, fill: 'none', stroke: 'url(#lineColor)', strokeWidth: 3, strokeLinejoin: 'round' }),
    data.map((d, i) =>
      React.createElement('circle', { key: i, cx: x(i), cy: y(d.saldo), r: 3.5, fill: '#7C3AED' })
    ),
    data.map((d, i) =>
      i % Math.max(1, Math.ceil(data.length / 5)) === 0
        ? React.createElement(
            'text',
            { key: 'x' + i, x: x(i), y: height - 4, fontSize: 9, fill: '#9187AC', textAnchor: 'middle' },
            new Date(d.date).toLocaleDateString('es-CO', { day: '2-digit', month: '2-digit' })
          )
        : null
    )
  );
}


const RATE = 0.2; // 20% - de 100 mil se devuelven 120 mil
const WEEKS = 4;
const MS_DAY = 86400000;

const AVATAR_COLORS = [
  { bg: "#FDE7F3", fg: "#C0247A" },
  { bg: "#E4F3FF", fg: "#1E6FD9" },
  { bg: "#FFF1DA", fg: "#D9791E" },
  { bg: "#E6F8EE", fg: "#178A56" },
  { bg: "#F1E9FF", fg: "#7239C9" },
  { bg: "#FFE8E5", fg: "#DE4B3B" },
];
function avatarColor(id) {
  return AVATAR_COLORS[Math.abs(id) % AVATAR_COLORS.length];
}

function fmt(n) {
  return "$" + Math.round(n).toLocaleString("es-CO");
}

function fmtDate(d) {
  return new Date(d).toLocaleDateString("es-CO", { day: "2-digit", month: "short", year: "numeric" });
}

// Regla: si el préstamo se da hasta el martes (inclusive) de esa semana, el primer pago es el sábado de esa misma semana.
// Si se da después del martes (miércoles a sábado), el primer pago pasa al sábado de la semana siguiente.
function firstDueDate(loanDateStr) {
  const d = new Date(loanDateStr + "T00:00:00");
  const day = d.getDay(); // 0 dom ... 6 sab
  const out = new Date(d);
  if (day <= 2) {
    out.setDate(d.getDate() + (6 - day));
  } else {
    out.setDate(d.getDate() + (13 - day));
  }
  return out;
}

function dueSchedule(loan) {
  const weeks = loan.weeks || WEEKS;
  const first = firstDueDate(loan.date);
  const quota = (loan.amount * (1 + RATE)) / weeks;
  const dates = [];
  for (let i = 0; i < weeks; i++) {
    const dd = new Date(first);
    dd.setDate(first.getDate() + i * 7);
    dates.push(dd);
  }
  return { quota, dates };
}

const LOCAL_BACKUP_KEY = 'finando_backup_v1';

function useStorage() {
  const [clients, setClients] = useState(() => {
    try {
      const raw = localStorage.getItem(LOCAL_BACKUP_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  });
  const [saveStatus, setSaveStatus] = useState('idle'); // idle | saving | saved | error
  const reconciled = useRef(false);

  useEffect(() => {
    const ref = db.collection('finando').doc('clients');
    const unsub = ref.onSnapshot(
      (snap) => {
        const cloudList = snap.exists ? snap.data().list || [] : [];

        // Al primer dato que llega de la nube: si en este celular hay un respaldo local
        // que no coincide (por ejemplo, un cambio que nunca se alcanzó a guardar),
        // lo volvemos a intentar subir en vez de perderlo.
        if (!reconciled.current) {
          reconciled.current = true;
          let localBackup = null;
          try {
            const raw = localStorage.getItem(LOCAL_BACKUP_KEY);
            localBackup = raw ? JSON.parse(raw) : null;
          } catch (e) {}
          if (localBackup && JSON.stringify(localBackup) !== JSON.stringify(cloudList)) {
            setClients(localBackup);
            ref.set({ list: localBackup }).catch((e) => console.error('No se pudo recuperar el respaldo local', e));
            return;
          }
        }

        setClients(cloudList);
        try {
          localStorage.setItem(LOCAL_BACKUP_KEY, JSON.stringify(cloudList));
        } catch (e) {}
      },
      (err) => {
        console.error('Error leyendo datos de la nube, se usa el respaldo local si existe', err);
        setClients((prev) => prev ?? []);
      }
    );
    return () => unsub();
  }, []);

  const save = async (next) => {
    setClients(next);
    // Respaldo local INMEDIATO: aunque se cierre la app antes de que termine de subir a la nube, esto ya quedó guardado en el celular.
    try {
      localStorage.setItem(LOCAL_BACKUP_KEY, JSON.stringify(next));
    } catch (e) {}
    setSaveStatus('saving');
    try {
      await db.collection('finando').doc('clients').set({ list: next });
      setSaveStatus('saved');
      setTimeout(() => setSaveStatus((s) => (s === 'saved' ? 'idle' : s)), 2000);
    } catch (e) {
      console.error('No se pudo guardar en la nube (queda respaldado en el celular y se reintentará)', e);
      setSaveStatus('error');
    }
  };

  return [clients, save, saveStatus];
}

function computeBalance(client) {
  const prestado = client.loans.reduce((s, l) => s + l.amount * (1 + RATE), 0);
  const abonado = client.payments.reduce((s, p) => s + p.amount, 0);
  return prestado - abonado;
}

function computeTimeline(client) {
  const events = [
    ...client.loans.map((l) => ({ date: l.date, delta: l.amount * (1 + RATE), type: "loan" })),
    ...client.payments.map((p) => ({ date: p.date, delta: -p.amount, type: "payment" })),
  ].sort((a, b) => new Date(a.date) - new Date(b.date));

  let running = 0;
  const points = [{ date: events.length ? events[0].date : new Date().toISOString().slice(0, 10), saldo: 0, type: "start" }];
  for (const e of events) {
    running += e.delta;
    points.push({ date: e.date, saldo: Math.max(0, Math.round(running)), type: e.type });
  }
  return points;
}

function nextDueInfo(client) {
  if (client.loans.length === 0) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  let earliest = null;
  let totalQuota = 0;
  for (const loan of client.loans) {
    const { quota, dates } = dueSchedule(loan);
    totalQuota += quota;
    for (const d of dates) {
      if (d >= today && (!earliest || d < earliest)) earliest = d;
    }
  }
  return { date: earliest, quota: totalQuota };
}

// Calendario completo de cuotas del cliente (todas las fechas, marcando cuáles ya quedaron cubiertas por los abonos)
function fullSchedule(client) {
  const map = {};
  client.loans.forEach((loan) => {
    const { quota, dates } = dueSchedule(loan);
    dates.forEach((d) => {
      const key = d.toISOString().slice(0, 10);
      map[key] = (map[key] || 0) + quota;
    });
  });
  const entries = Object.entries(map)
    .map(([date, amount]) => ({ date, amount }))
    .sort((a, b) => new Date(a.date) - new Date(b.date));

  const paid = client.payments.reduce((s, p) => s + p.amount, 0);
  let cum = 0;
  const today = new Date().toISOString().slice(0, 10);
  return entries.map((e) => {
    cum += e.amount;
    return { ...e, status: cum <= paid ? "pagada" : e.date < today ? "atrasada" : "pendiente" };
  });
}

function endOfWeek() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  const day = d.getDay();
  const add = day === 6 ? 0 : 6 - day;
  d.setDate(d.getDate() + add);
  return d;
}

// Interés por mora: mismo 20% mensual (RATE), prorrateado por día de atraso, sobre cada cuota vencida sin pagar
function moraInterest(client) {
  const schedule = fullSchedule(client);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const dailyRate = RATE / 30;
  let mora = 0;
  schedule.forEach((s) => {
    if (s.status === "atrasada") {
      const due = new Date(s.date + "T00:00:00");
      const days = Math.floor((today - due) / MS_DAY);
      if (days > 0) mora += s.amount * dailyRate * days;
    }
  });
  return mora;
}

function totalDebt(client) {
  return computeBalance(client) + moraInterest(client);
}

// Capital inicial prestado (sin interés). Se usa para congelar la deuda de cartera dudosa.
function capitalInicial(client) {
  return client.loans.reduce((s, l) => s + l.amount, 0);
}

// Capital que aún falta por pagar (los abonos se aplican primero al capital).
// Sirve para calcular cuánto interés queda pendiente al condonar solo intereses.
function remainingCapital(client) {
  const abonado = client.payments.filter((p) => !p.condonacion).reduce((s, p) => s + p.amount, 0);
  return Math.max(0, capitalInicial(client) - abonado);
}

// Reparte cada abono primero al capital y lo que sobra a interés (mismo criterio que remainingCapital),
// para poder saber cuánto de lo cobrado en un periodo fue capital y cuánto fue interés.
function interestCollectedSince(client, sinceDate) {
  let capitalLeft = capitalInicial(client);
  let interest = 0;
  const pays = [...client.payments].filter((p) => !p.condonacion).sort((a, b) => new Date(a.date) - new Date(b.date));
  pays.forEach((p) => {
    const toCapital = Math.min(capitalLeft, p.amount);
    const toInterest = p.amount - toCapital;
    capitalLeft -= toCapital;
    const pDate = new Date(p.date + "T00:00:00");
    if (pDate >= sinceDate) interest += toInterest;
  });
  return interest;
}

// Cartera de dudoso recaudo: más de 3 cuotas atrasadas sin pagar
function isDudoso(client) {
  return fullSchedule(client).filter((s) => s.status === "atrasada").length > 3;
}

// Deuda a mostrar de un cliente: si es dudoso recaudo, se congela en el capital inicial
// (sin seguir sumando interés ni mora); si no, es la deuda normal con interés y mora.
function displayDebt(client) {
  return isDudoso(client) ? capitalInicial(client) : totalDebt(client);
}

// Clientes con cobro pendiente esta semana (incluye atrasados de semanas previas), sin contar cartera dudosa
function weeklyCollections(clients) {
  const limit = endOfWeek();
  return clients
    .filter((c) => !isDudoso(c))
    .map((c) => ({ client: c, balance: totalDebt(c), next: nextDueInfo(c) }))
    .filter((x) => x.balance > 0 && x.next && x.next.date && x.next.date <= limit)
    .sort((a, b) => a.next.date - b.next.date);
}

function ClientDetail({ client, onBack, onUpdate }) {
  const [modal, setModal] = useState(null);
  const [showReport, setShowReport] = useState(false);
  const dudoso = isDudoso(client);
  const balance = computeBalance(client);
  const mora = moraInterest(client);
  const debt = dudoso ? capitalInicial(client) : balance + mora;
  const timeline = useMemo(() => computeTimeline(client), [client]);
  const next = nextDueInfo(client);

  if (showReport) {
    return <ClientReport client={client} onClose={() => setShowReport(false)} />;
  }

  const addLoan = (values) => {
    const amount = parseFloat(values.amount);
    if (!amount || amount <= 0) return setModal(null);
    const weeks = parseInt(values.weeks, 10) === 8 ? 8 : 4;
    const loan = { id: Date.now(), amount, weeks, date: values.date || new Date().toISOString().slice(0, 10) };
    onUpdate({ ...client, loans: [...client.loans, loan] });
    setModal(null);
  };

  const addPayment = (values) => {
    const amount = parseFloat(values.amount);
    if (!amount || amount <= 0) return setModal(null);
    const payment = { id: Date.now(), amount, date: values.date || new Date().toISOString().slice(0, 10) };
    onUpdate({ ...client, payments: [...client.payments, payment] });
    setModal(null);
  };

  const interesPendiente = Math.max(0, debt - remainingCapital(client));

  const condonar = (tipo) => {
    const amount = tipo === "total" ? debt : interesPendiente;
    if (amount <= 0) return setModal(null);
    const payment = {
      id: Date.now(),
      amount,
      date: new Date().toISOString().slice(0, 10),
      condonacion: tipo, // 'total' | 'interes'
    };
    onUpdate({ ...client, payments: [...client.payments, payment] });
    setModal(null);
  };

  const today = new Date().toISOString().slice(0, 10);

  const av = avatarColor(client.id);

  return (
    <div className="max-w-md mx-auto pb-28">
      <div className="flex items-center gap-2 px-5 pt-6 pb-2">
        <button onClick={onBack} className="text-white/70 hover:text-white -ml-1 p-1">
          <ChevronLeft size={22} />
        </button>
        <div className="w-9 h-9 rounded-full flex items-center justify-center font-serif font-semibold" style={{ backgroundColor: av.bg, color: av.fg }}>
          {client.name.charAt(0).toUpperCase()}
        </div>
        <h2 className="font-serif text-2xl text-white flex-1">{client.name}</h2>
        <button
          onClick={() => setShowReport(true)}
          className="rounded-full p-2.5 shadow-md"
          style={{ backgroundColor: "#FFFFFF" }}
          aria-label="Historial del cliente"
        >
          <ClipboardList size={17} color="#7C3AED" />
        </button>
      </div>

      <div
        className="mx-5 mt-3 rounded-3xl p-5 text-white shadow-lg"
        style={{ background: dudoso ? "linear-gradient(135deg,#DC2626,#7F1D1D)" : "linear-gradient(135deg,#7C3AED,#DB2777)" }}
      >
        <div className="text-xs uppercase tracking-wider text-white/70 mb-1 font-semibold">
          {dudoso ? "⚠️ Dudoso recaudo · capital inicial" : "Debe actualmente"}
        </div>
        <div className="font-serif text-4xl">{fmt(Math.max(0, debt))}</div>
        {dudoso ? (
          <div className="text-xs text-white/80 mt-1">Más de 3 cuotas sin pagar: se congeló el capital y ya no se suma más interés ni mora.</div>
        ) : (
          mora > 1 && <div className="text-xs text-white/80 mt-1">incluye {fmt(mora)} de mora por atraso</div>
        )}
        {!dudoso && next && debt > 0 && (
          <div className="mt-3 pt-3 border-t border-white/25 flex justify-between text-sm text-white/90">
            <span>Próxima cuota</span>
            <span className="font-semibold">
              {fmt(next.quota)} · {next.date ? fmtDate(next.date) : "—"}
            </span>
          </div>
        )}
        {!dudoso && debt <= 0 && client.loans.length > 0 && (
          <div className="mt-3 pt-3 border-t border-white/25 text-sm text-white/90">✨ Al día, sin saldo pendiente</div>
        )}
      </div>

      {timeline.length > 1 && (
        <div className="mx-5 mt-5 bg-white rounded-3xl p-4 shadow-md">
          <div className="text-xs uppercase tracking-wide font-semibold text-[#9187AC] mb-3">Evolución del saldo</div>
          <BalanceChart data={timeline} />
        </div>
      )}

      <div className="flex gap-3 px-5 mt-5">
        <button
          onClick={() => setModal("loan")}
          className="flex-1 rounded-2xl py-3 text-sm font-semibold text-white flex items-center justify-center gap-2 shadow-md"
          style={{ backgroundColor: "#F59E0B" }}
        >
          <Plus size={16} /> Nuevo préstamo
        </button>
        <button
          onClick={() => setModal("payment")}
          className="flex-1 rounded-2xl py-3 text-sm font-semibold text-white flex items-center justify-center gap-2 shadow-md"
          style={{ backgroundColor: "#10B981" }}
        >
          <Plus size={16} /> Registrar abono
        </button>
      </div>

      {debt > 0 && (
        <div className="px-5 mt-3">
          <button
            onClick={() => setModal("condonar")}
            className="w-full rounded-2xl py-3 text-sm font-semibold flex items-center justify-center gap-2 border-2 border-dashed"
            style={{ borderColor: "#C4B5FD", color: "#7C3AED", backgroundColor: "#F5F3FF" }}
          >
            <Gift size={16} /> Condonar deuda o intereses
          </button>
        </div>
      )}

      <div className="px-5 mt-6">
        <div className="text-xs uppercase tracking-wide font-semibold text-white/70 mb-2 flex items-center gap-1">
          <Calendar size={12} /> Fechas a pagar
        </div>
        <div className="bg-white rounded-2xl p-2 shadow-sm">
          {fullSchedule(client).map((s, i) => {
            const due = new Date(s.date + "T00:00:00");
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const daysLate = s.status === "atrasada" ? Math.floor((today - due) / MS_DAY) : 0;
            const entryMora = daysLate > 0 ? s.amount * (RATE / 30) * daysLate : 0;
            return (
              <div key={s.date} className={"px-3 py-2.5 " + (i !== 0 ? "border-t border-[#F1EBFF]" : "")}>
                <div className="flex items-center justify-between">
                  <div className="text-sm text-[#241B3D]">{fmtDate(s.date)}</div>
                  <div className="flex items-center gap-2">
                    <span className="text-sm font-medium text-[#241B3D]">{fmt(s.amount)}</span>
                    <span
                      className="text-[10px] font-semibold uppercase px-2 py-1 rounded-full"
                      style={{
                        backgroundColor: s.status === "pagada" ? "#DCFCE9" : s.status === "atrasada" ? "#FFE1DE" : "#FFF3DC",
                        color: s.status === "pagada" ? "#0F7A4F" : s.status === "atrasada" ? "#C0281A" : "#B45309",
                      }}
                    >
                      {s.status}
                    </span>
                  </div>
                </div>
                {entryMora > 1 && (
                  <div className="text-[11px] text-[#C0281A] text-right mt-0.5">
                    +{fmt(entryMora)} de mora ({daysLate} día{daysLate === 1 ? "" : "s"})
                  </div>
                )}
              </div>
            );
          })}
          {client.loans.length === 0 && <div className="text-sm text-[#9187AC] text-center py-4">Sin préstamos activos</div>}
        </div>
      </div>

      <div className="px-5 mt-6">
        <div className="text-xs uppercase tracking-wide font-semibold text-white/70 mb-2">Movimientos</div>
        <div className="space-y-2">
          {[...client.loans.map((l) => ({ ...l, kind: "loan" })), ...client.payments.map((p) => ({ ...p, kind: p.condonacion ? "condonacion" : "payment" }))]
            .sort((a, b) => new Date(b.date) - new Date(a.date))
            .map((m) => (
              <div key={m.kind + m.id} className="flex items-center justify-between bg-white rounded-2xl px-4 py-3 shadow-sm">
                <div className="flex items-center gap-3">
                  <div
                    className="w-8 h-8 rounded-full flex items-center justify-center text-xs"
                    style={{
                      backgroundColor: m.kind === "loan" ? "#FFF3DC" : m.kind === "condonacion" ? "#F5F3FF" : "#DCFCE9",
                      color: m.kind === "loan" ? "#B45309" : m.kind === "condonacion" ? "#7C3AED" : "#0F7A4F",
                    }}
                  >
                    {m.kind === "loan" ? "💰" : m.kind === "condonacion" ? "🎁" : "✅"}
                  </div>
                  <div>
                    <div className="text-sm text-[#241B3D] font-medium">
                      {m.kind === "loan" ? "Préstamo" : m.kind === "condonacion" ? (m.condonacion === "total" ? "Condonación total" : "Condonación de intereses") : "Abono"}
                    </div>
                    <div className="text-xs text-[#9187AC]">{fmtDate(m.date)}</div>
                  </div>
                </div>
                <div className={"font-semibold " + (m.kind === "loan" ? "text-[#F59E0B]" : m.kind === "condonacion" ? "text-[#7C3AED]" : "text-[#10B981]")}>
                  {m.kind === "loan" ? "+" + fmt(m.amount * (1 + RATE)) : "-" + fmt(m.amount)}
                </div>
              </div>
            ))}
          {client.loans.length === 0 && client.payments.length === 0 && (
            <div className="text-sm text-white/70 text-center py-6">Sin movimientos todavía</div>
          )}
        </div>
      </div>

      {modal === "loan" && (
        <AddModal
          title="Nuevo préstamo"
          accent="#F59E0B"
          fields={[
            { key: "amount", label: "Valor prestado (COP)", type: "number", placeholder: "100000" },
            {
              key: "weeks",
              label: "Plazo",
              type: "select",
              default: "4",
              options: [
                { value: "4", label: "4 semanas" },
                { value: "8", label: "8 semanas" },
              ],
            },
            { key: "date", label: "Fecha", type: "date", default: today },
          ]}
          onCancel={() => setModal(null)}
          onSubmit={addLoan}
        />
      )}
      {modal === "payment" && (
        <AddModal
          title="Registrar abono"
          accent="#10B981"
          fields={[
            { key: "amount", label: "Valor abonado (COP)", type: "number", placeholder: "30000" },
            { key: "date", label: "Fecha", type: "date", default: today },
          ]}
          onCancel={() => setModal(null)}
          onSubmit={addPayment}
        />
      )}
      {modal === "condonar" && (
        <div className="fixed inset-0 bg-[#2B1F45]/50 flex items-end sm:items-center justify-center z-50 p-0 sm:p-4">
          <div className="bg-white w-full sm:max-w-sm sm:rounded-3xl rounded-t-3xl p-6 shadow-2xl border-t-4 sm:border-4" style={{ borderColor: "#7C3AED" }}>
            <div className="flex items-center justify-between mb-4">
              <h3 className="font-serif text-xl text-[#241B3D] flex items-center gap-2">
                <Gift size={18} /> Condonar
              </h3>
              <button onClick={() => setModal(null)} className="text-[#B3A9CB] hover:text-[#241B3D]">
                <X size={20} />
              </button>
            </div>
            <p className="text-sm text-[#6B6280] mb-4">Elige qué le quieres perdonar a {client.name}. Esta acción no se puede deshacer.</p>

            <button
              onClick={() => condonar("interes")}
              disabled={interesPendiente <= 0}
              className="w-full text-left rounded-xl border-2 border-[#EDE7F6] p-3.5 mb-3 disabled:opacity-40"
            >
              <div className="font-medium text-[#241B3D]">Solo los intereses</div>
              <div className="text-xs text-[#9187AC] mt-0.5">Deja debiendo solo el capital · perdona {fmt(interesPendiente)}</div>
            </button>

            <button onClick={() => condonar("total")} className="w-full text-left rounded-xl border-2 border-[#EDE7F6] p-3.5">
              <div className="font-medium text-[#241B3D]">Toda la deuda</div>
              <div className="text-xs text-[#9187AC] mt-0.5">Queda saldado en $0 · perdona {fmt(debt)}</div>
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

        </div>
        <div>
          <div className="text-[#241B3D] font-medium flex items-center gap-1.5">
            {client.name}
            {dudoso && (
              <span className="text-[9px] font-bold uppercase px-1.5 py-0.5 rounded-full" style={{ backgroundColor: "#FEE2E2", color: "#B91C1C" }}>
                dudoso
              </span>
            )}
          </div>
          {dudoso ? (
            <div className="text-xs text-[#B91C1C]">Capital inicial · sin más interés</div>
          ) : next && balance > 0 ? (
            <div className="text-xs text-[#9187AC] flex items-center gap-1">
              <Calendar size={11} /> {next.date ? fmtDate(next.date) : "sin cuotas"} · {fmt(next.quota)}
            </div>
          ) : (
            <div className="text-xs text-[#9187AC]">{client.loans.length === 0 ? "Sin préstamos" : "🎉 Al día"}</div>
          )}
        </div>
      </div>
      <div className="text-right">
        <div className={"font-serif text-lg font-semibold " + (dudoso ? "text-[#B91C1C]" : balance > 0 ? "text-[#DB2777]" : "text-[#10B981]")}>{fmt(Math.max(0, balance))}</div>
      </div>
    </button>
  );
}

function App() {
  const [clients, saveClients, saveStatus] = useStorage();
  const [selected, setSelected] = useState(null);
  const [modal, setModal] = useState(false);
  const [showReport, setShowReport] = useState(false);
  const [showGeneralReport, setShowGeneralReport] = useState(false);

  if (clients === null) {
    return (
      <div className="min-h-screen bg-[#F5F0E4] flex items-center justify-center text-[#9C8F7E]">
        Cargando...
      </div>
    );
  }

  const selectedClient = clients.find((c) => c.id === selected);

  const dudosos = clients.filter((c) => isDudoso(c));
  const buenos = clients.filter((c) => !isDudoso(c));
  const totalPrestado = buenos.reduce((s, c) => s + Math.max(0, totalDebt(c)), 0);
  const weekly = weeklyCollections(clients);
  const totalSemana = weekly.reduce((s, x) => s + x.next.quota, 0);
  const totalDudoso = dudosos.reduce((s, c) => s + Math.max(0, capitalInicial(c)), 0);

  const addClient = (values) => {
    if (!values.name.trim()) return setModal(false);
    const client = { id: Date.now(), name: values.name.trim(), loans: [], payments: [] };
    saveClients([...clients, client]);
    setModal(false);
  };

  const updateClient = (updated) => {
    saveClients(clients.map((c) => (c.id === updated.id ? updated : c)));
  };

  return (
    <div className="min-h-screen" style={{ fontFamily: "'Inter', sans-serif", background: "linear-gradient(180deg,#7C3AED 0%,#7C3AED 140px,#F6F3FF 140px)" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
        .font-serif { font-family: 'Fraunces', serif; }
      `}</style>

      {showReport ? (
        <WeeklyReport clients={clients} onClose={() => setShowReport(false)} />
      ) : showGeneralReport ? (
        <GeneralReport clients={clients} onClose={() => setShowGeneralReport(false)} />
      ) : selectedClient ? (
        <div style={{ background: "linear-gradient(180deg,#7C3AED 0%,#7C3AED 260px,#F6F3FF 260px)", minHeight: "100vh" }}>
          <ClientDetail client={selectedClient} onBack={() => setSelected(null)} onUpdate={updateClient} />
        </div>
      ) : (
        <div className="max-w-md mx-auto pb-28">
          <div className="px-5 pt-7 pb-3 flex items-start justify-between">
            <div>
              <div className="flex items-center gap-2 text-white/80 text-xs uppercase tracking-wider mb-1 font-semibold">
                <Wallet size={13} /> Control de préstamos
              </div>
              <h1 className="font-serif text-3xl text-white font-semibold">Finando App</h1>
            </div>
            <div className="flex gap-2 mt-1">
              <button
                onClick={() => setShowGeneralReport(true)}
                className="rounded-full p-2.5 shadow-md"
                style={{ backgroundColor: "#FFFFFF" }}
                aria-label="Reporte general"
              >
                <ClipboardList size={18} color="#7C3AED" />
              </button>
              <button
                onClick={() => setShowReport(true)}
                className="rounded-full p-2.5 shadow-md"
                style={{ backgroundColor: "#FFFFFF" }}
                aria-label="Reporte semanal"
              >
                <FileDown size={18} color="#7C3AED" />
              </button>
            </div>
          </div>

          <div className="px-5 flex gap-3">
            <div className="flex-1 rounded-3xl p-4 text-white shadow-lg" style={{ background: "linear-gradient(135deg,#F59E0B,#DB2777)" }}>
              <div className="text-[10px] uppercase tracking-wider text-white/80 font-semibold">Total por cobrar</div>
              <div className="font-serif text-2xl mt-1 font-semibold leading-tight break-words">{fmt(totalPrestado)}</div>
            </div>
            <div className="flex-1 rounded-3xl p-4 text-white shadow-lg" style={{ background: "linear-gradient(135deg,#7C3AED,#4C1D95)" }}>
              <div className="text-[10px] uppercase tracking-wider text-white/80 font-semibold">Esta semana</div>
              <div className="font-serif text-2xl mt-1 font-semibold leading-tight break-words">{fmt(totalSemana)}</div>
              <div className="text-[11px] text-white/70 mt-0.5">{weekly.length} cliente{weekly.length === 1 ? "" : "s"}</div>
            </div>
          </div>

          <div className="px-5 mt-3">
            <div
              className="rounded-3xl p-4 text-white shadow-lg"
              style={{ background: dudosos.length > 0 ? "linear-gradient(135deg,#DC2626,#7F1D1D)" : "linear-gradient(135deg,#A8A29E,#57534E)" }}
            >
              <div className="text-[10px] uppercase tracking-wider text-white/80 font-semibold">⚠️ Dudoso recaudo (+3 cuotas sin pagar)</div>
              <div className="font-serif text-2xl mt-1 font-semibold leading-tight break-words">{fmt(totalDudoso)}</div>
              <div className="text-[11px] text-white/70 mt-0.5">
                {dudosos.length} cliente{dudosos.length === 1 ? "" : "s"} · capital inicial, sin más interés · no incluido en los totales de arriba
              </div>
            </div>
          </div>

          <div className="px-5 mt-6 flex items-center justify-between">
            <div className="text-xs uppercase tracking-wide font-semibold" style={{ color: "#7C3AED" }}>
              Clientes
            </div>
            <button
              onClick={() => setModal(true)}
              className="text-sm font-semibold rounded-full px-4 py-2 flex items-center gap-1 shadow-md"
              style={{ backgroundColor: "#7C3AED", color: "#FFFFFF" }}
            >
              <Plus size={15} /> Nuevo
            </button>
          </div>

          <div className="px-5 mt-3 space-y-2.5">
            {clients.map((c) => (
              <ClientCard key={c.id} client={c} onClick={() => setSelected(c.id)} />
            ))}
            {clients.length === 0 && (
              <div className="text-center py-14 text-[#9187AC]">
                <div className="mb-2">Todavía no hay clientes</div>
                <button onClick={() => setModal(true)} className="text-[#7C3AED] font-semibold text-sm">
                  Agregar el primero
                </button>
              </div>
            )}
          </div>
        </div>
      )}

      {modal && (
        <AddModal
          title="Nuevo cliente"
          accent="#7C3AED"
          fields={[{ key: "name", label: "Nombre", placeholder: "Ej: Doña Marta" }]}
          onCancel={() => setModal(false)}
          onSubmit={addClient}
        />
      )}

      {saveStatus === "saving" && (
        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 bg-[#241B3D] text-white text-sm px-4 py-2 rounded-full shadow-lg z-50">
          Guardando…
        </div>
      )}
      {saveStatus === "saved" && (
        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 bg-[#10B981] text-white text-sm px-4 py-2 rounded-full shadow-lg z-50">
          ✓ Guardado
        </div>
      )}
      {saveStatus === "error" && (
        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 bg-[#DC2626] text-white text-sm px-4 py-2.5 rounded-full shadow-lg z-50 flex items-center gap-2">
          ⚠️ No se pudo guardar — revisa tu conexión y espera antes de cerrar
        </div>
      )}
    </div>
  );
}


try {
  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
} catch (e) {
  document.getElementById('root').innerHTML = '';
  showError('Fallo al iniciar la app: ' + e.message);
}

} catch (topLevelError) {
  document.getElementById('root').innerHTML = '';
  showError('Error real detectado:\n' + (topLevelError && topLevelError.stack ? topLevelError.stack : topLevelError));
}

</script>
</body>
</html>
